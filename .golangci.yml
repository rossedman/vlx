version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - misspell
    - unconvert
    - nolintlint
    - copyloopvar
    - gocritic
    - bodyclose
  settings:
    errcheck:
      exclude-functions:
        # Closing sockets and files we are done with; errors carry no signal.
        - (*os.File).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - (*net.UnixConn).Close
        - (*github.com/rossedman/sdvarlink/varlink.Conn).Close
        - (*github.com/rossedman/vlx/internal/demo.Server).Close
        - os.Remove
        - os.RemoveAll
        - fmt.Fprintln
        - fmt.Fprintf
        - fmt.Fprint
    misspell:
      ignore-rules:
        - importd # sdvarlink's package for io.systemd.Import, named after systemd-importd
    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [errcheck, gocritic]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/rossedman/vlx
