name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
        go: [stable]
        include:
          - os: ubuntu-24.04
            go: oldstable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      # The CLI and TUI tests run against vlx's built-in demo service over a
      # real Unix socket, so they need no systemd.
      - name: Unit and end-to-end tests (race)
        run: go test -race -count=1 -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Coverage is at least 90%
        run: ./hack/check-coverage.sh coverage.out 90
      - name: Smoke-test the binary
        run: |
          go build -o vlx ./cmd/vlx
          ./vlx version
          XDG_RUNTIME_DIR="$(mktemp -d)"
          export XDG_RUNTIME_DIR
          ./vlx demo --serve >/dev/null 2>&1 &
          for _ in $(seq 50); do ./vlx list | grep -q io.vlx.demo && break; sleep 0.1; done
          ./vlx call demo GetGreeting '{"name":"CI"}'
          # Writes are refused in read-only mode with exit code 4.
          status=0; ./vlx call demo SetDefaultLanguage '{"language":"german"}' || status=$?
          test "$status" -eq 4
          kill %1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-24.04' && matrix.go == 'stable'
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.5.0
      - name: One Cobra command per file
        run: ./tools/check-cmds.sh
      - name: Doc comments
        run: go run ./tools/doccheck ./...

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: make vuln

  bench-fuzz:
    name: Benchmarks and fuzzing (smoke)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Every benchmark once
        run: make bench-smoke
      - name: Every fuzz target for 30s
        run: make fuzz FUZZTIME=30s

  goreleaser:
    name: GoReleaser config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
