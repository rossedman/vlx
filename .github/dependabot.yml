version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      charm:
        patterns: ["github.com/charmbracelet/*"]
      spf13:
        patterns: ["github.com/spf13/*"]
      go-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    commit-message:
      prefix: docs
    groups:
      docs:
        patterns: ["*"]
