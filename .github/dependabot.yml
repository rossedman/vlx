version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      charm:
        patterns: ["github.com/charmbracelet/*"]
      spf13:
        patterns: ["github.com/spf13/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: monthly
