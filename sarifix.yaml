# sarifix: scans vlx with the tools below and turns the findings in
# rules.allow into GitHub issues. See https://rossedman.io/sarifix/configuration/
# and the config reference for every key and its default.
version: 1

scanners:
  # Uses the repo's .golangci.yml, so it reports what `make lint` does.
  - name: golangci-lint
    command: ["golangci-lint", "run", "--output.sarif.path={out}", "./..."]
    workdir: "{dir}"
    scope: dir

  # Known vulnerabilities in go.mod and docs/requirements.txt.
  - name: trivy
    match: ["Trivy"]
    command: ["trivy", "fs", "--scanners", "vuln", "--format", "sarif", "-o", "{out}", "{dir}"]
    scope: repo

  # Committed secrets. Reported to code scanning only: a leaked secret needs
  # rotating by a person, not a code edit (see rules.deny).
  - name: gitleaks
    command: ["gitleaks", "dir", "{dir}", "--report-format", "sarif", "--report-path", "{out}", "--redact", "--no-banner"]
    scope: repo
    offline: true

rules:
  allow:
    - golangci-lint/*
    - trivy/CVE-*
    - trivy/GHSA-*
  deny: ["gitleaks/*"]
  min_level: warning

paths:
  deny:
    - ".github/workflows/**"
    - "docs/reference/cli/**" # generated by `make docs-reference`

verify:
  commands:
    - ["make", "lint"]
    - ["make", "race"]
    - ["make", "check-cmds"]
    - ["make", "doccheck"]

agent:
  extra_instructions: CONTRIBUTING.md
