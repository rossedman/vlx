<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="diagram.css"><style>body{width:1200px;height:330px}
.s{position:absolute;top:110px;width:250px;height:176px;padding:18px}
.num{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 14px 'DejaVu Sans Mono',monospace;color:#0f1117;margin-bottom:12px}
.key{display:inline-block;font:700 12px 'DejaVu Sans Mono',monospace;padding:2px 7px;border-radius:5px;background:#26213a;border:1px solid #4a3d73;color:#C4B5FD}
</style></head><body>
<div class="bg"></div><div class="dots"></div>
<h1>QuickStart</h1><h2>From zero to your first call in four keys</h2>
<svg class="wires" width="1200" height="330"><g stroke="#3a3546" stroke-width="2" stroke-dasharray="4 5"><path d="M294 198H326"/><path d="M576 198H608"/><path d="M858 198H890"/></g></svg>
<div class="node s" style="left:44px"><div class="num" style="background:#A78BFA">1</div><div class="n" style="font-size:16px">Launch</div><div class="d"><span class="mono c">vlx demo</span><br>or just <span class="mono c">vlx</span> on a systemd host</div></div>
<div class="node s" style="left:326px"><div class="num" style="background:#8B5CF6">2</div><div class="n" style="font-size:16px">Open a service</div><div class="d"><span class="key">↑↓</span> pick a socket<br><span class="key">⏎</span> connect &amp; introspect</div></div>
<div class="node s" style="left:608px"><div class="num" style="background:#38BDF8">3</div><div class="n" style="font-size:16px">Pick a method</div><div class="d"><span class="key">⇥</span> to the tree, read the docs<br><span class="key">c</span> opens a pre-filled call</div></div>
<div class="node s" style="left:890px"><div class="num" style="background:#22D3EE">4</div><div class="n" style="font-size:16px">Send</div><div class="d"><span class="key">ctrl+s</span> validates and sends<br>replies stream in live</div></div>
</body></html>
